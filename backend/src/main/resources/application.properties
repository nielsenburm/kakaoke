# Active profile (set by Maven -P flag)
spring.profiles.active=@spring.profiles.active@

server.port=8080

# Upload limits
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# JPA defaults
spring.jpa.open-in-view=false

# S3 defaults (shared across dev & prod)
kakaoke.storage.s3.bucket=${KAKAOKE_S3_BUCKET:kakaoke-storage}
kakaoke.storage.s3.region=${AWS_REGION:eu-central-1}
kakaoke.storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
kakaoke.storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
