# Dev profile — S3 with dev prefix, local Postgres

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/kakaoke
spring.datasource.username=${DATABASE_USER:kakaoke}
spring.datasource.password=${DATABASE_PASSWORD:kakaoke}
spring.jpa.hibernate.ddl-auto=update

# Storage — S3 with dev folder
kakaoke.storage.type=s3
kakaoke.storage.s3.prefix=songs-dev/
kakaoke.storage.file.root=${KAKAOKE_SONGS_ROOT:./ultrastar-songs-dev}
