# Prod profile — S3 with IAM role, Postgres via env vars

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# Storage — S3 production folder (credentials via IAM role)
kakaoke.storage.type=s3
kakaoke.storage.s3.prefix=songs/
