openapi: 3.1.0
info:
  title: KAKAoke API
  description: |
    Backend API for the KAKAoke karaoke web application.
    Serves UltraStar song metadata, synchronized lyrics, and media assets
    from a local song library.
  version: 1.0.0
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Songs
    description: Browse, search, and retrieve song metadata
  - name: Lyrics
    description: Synchronized lyric timelines for playback
  - name: Assets
    description: Media files (audio, cover art, background images)
  - name: Import
    description: Import new songs into the library
  - name: Filters
    description: Available filter values for the song library
  - name: Settings
    description: User-configurable application settings

paths:
  /api/songs:
    get:
      operationId: getSongs
      tags: [Songs]
      summary: List songs in the library
      description: |
        Returns a paginated list of songs. Supports full-text search across
        title and artist, filtering by genre, language, and year, and sorting.
      parameters:
        - name: search
          in: query
          description: |
            Free-text search query. Matches against song title and artist name
            (case-insensitive, partial match).
          schema:
            type: string
          example: "Bohemian"
        - name: genre
          in: query
          description: Filter by genre (case-insensitive exact match).
          schema:
            type: string
          example: "Rock"
        - name: edition
          in: query
          description: Filter by edition (case-insensitive exact match).
          schema:
            type: string
          example: "Charts"
        - name: language
          in: query
          description: Filter by language (case-insensitive exact match).
          schema:
            type: string
          example: "English"
        - name: year
          in: query
          description: Filter by release year.
          schema:
            type: integer
          example: 1975
        - name: sortBy
          in: query
          description: Field to sort results by.
          schema:
            type: string
            enum: [title, artist, year]
            default: title
        - name: sortOrder
          in: query
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          description: Zero-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of songs per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated list of songs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongPage"

  /api/songs/{songId}:
    get:
      operationId: getSongById
      tags: [Songs]
      summary: Get a single song by ID
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "200":
          description: Song metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSong
      tags: [Songs]
      summary: Update song metadata
      description: |
        Updates the metadata of an existing song. Only provided fields are
        updated — omitted fields retain their current values. To clear an
        optional field, send an empty string (for text) or an empty array
        (for tags).
      parameters:
        - $ref: "#/components/parameters/songId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SongUpdate"
      responses:
        "200":
          description: Updated song metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSong
      tags: [Songs]
      summary: Delete a song from the library
      description: |
        Removes the song from the database and deletes all associated files
        from storage (audio, cover, background, UltraStar .txt). This action
        is irreversible.
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "204":
          description: Song successfully deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/songs/{songId}/lyrics:
    get:
      operationId: getLyricTimeline
      tags: [Lyrics]
      summary: Get the synchronized lyric timeline for a song
      description: |
        Returns the full lyric timeline with millisecond-accurate timing
        derived from the UltraStar note data. Each line contains tokens
        (syllables) with start time, duration, pitch, and note type.
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "200":
          description: Lyric timeline with timed tokens grouped into lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LyricTimeline"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/songs/{songId}/audio:
    get:
      operationId: getSongAudio
      tags: [Assets]
      summary: Stream the song's audio file
      description: |
        Returns the audio file for playback. Supports HTTP Range requests
        for seeking. The `#AUDIO` header takes precedence over `#MP3` if
        both are present in the UltraStar file.
      parameters:
        - $ref: "#/components/parameters/songId"
        - name: Range
          in: header
          description: Byte range for partial content requests (e.g. `bytes=0-1048575`).
          schema:
            type: string
      responses:
        "200":
          description: Full audio file.
          headers:
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Partial audio content (range request).
          headers:
            Content-Range:
              schema:
                type: string
                example: "bytes 0-1048575/5242880"
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            Content-Length:
              schema:
                type: integer
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Requested range not satisfiable.

  /api/songs/{songId}/cover:
    get:
      operationId: getSongCover
      tags: [Assets]
      summary: Get the song's cover image
      description: |
        Returns the cover artwork referenced by the `#COVER` header
        in the UltraStar file.
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "200":
          description: Cover image file.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/songs/{songId}/thumbnail:
    get:
      operationId: getSongThumbnail
      tags: [Assets]
      summary: Get a small thumbnail of the song's cover
      description: |
        Returns a ~200px JPEG thumbnail of the cover image. The thumbnail is
        stored in the database and available immediately after import (even while
        large files are still uploading to storage). Ideal for library grid views.
        For existing songs imported before thumbnail support, the thumbnail is
        generated on-demand on first request.
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "200":
          description: Thumbnail image (JPEG).
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=86400"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/songs/{songId}/background:
    get:
      operationId: getSongBackground
      tags: [Assets]
      summary: Get the song's background image
      description: |
        Returns the background image referenced by the `#BACKGROUND` header
        in the UltraStar file.
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "200":
          description: Background image file.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/songs/{songId}/played:
    post:
      operationId: markSongPlayed
      tags: [Songs]
      summary: Mark a song as played
      description: |
        Sets the `played` flag to `true` for the given song. This removes the
        "New" badge from the library grid. Idempotent — calling multiple times
        has no additional effect.
      parameters:
        - $ref: "#/components/parameters/songId"
      responses:
        "204":
          description: Song marked as played.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/songs/import:
    post:
      operationId: importSong
      tags: [Import]
      summary: Import a song from a ZIP archive
      description: |
        Accepts a ZIP file containing an UltraStar `.txt` file and its
        associated assets (audio, cover, background). The server extracts
        the archive, parses the UltraStar file, generates a cover thumbnail,
        uploads the `.txt` file synchronously, and saves the song to the
        database with `status: processing`. Large files (audio, cover,
        background) are uploaded to storage asynchronously in the background.

        The response returns immediately with the song metadata and thumbnail
        URL. The `status` field will be `processing` until all files finish
        uploading, then it transitions to `ready`. If the upload fails, the
        status becomes `broken`.

        **Deduplication:** The server computes a SHA-256 hash of the `.txt`
        file content. If an existing song has the same hash, the import
        replaces that song (same ID is kept, old files are cleaned up).
        This allows re-uploading a song to fix a broken entry.

        The ZIP must contain exactly one `.txt` file at any level.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP archive containing the UltraStar song and assets.
      responses:
        "201":
          description: Song successfully imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "400":
          description: |
            Invalid archive. Possible reasons: not a valid ZIP, no `.txt` file
            found, multiple `.txt` files found, or UltraStar parse error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/filters/genres:
    get:
      operationId: getGenres
      tags: [Filters]
      summary: List all genres present in the library
      description: |
        Returns the distinct genre values across all songs, sorted
        alphabetically. Useful for populating the genre filter dropdown.
      responses:
        "200":
          description: List of genre strings.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["Pop", "Rock", "R&B", "Electronic"]

  /api/filters/editions:
    get:
      operationId: getEditions
      tags: [Filters]
      summary: List all editions present in the library
      description: |
        Returns the distinct edition values across all songs, sorted
        alphabetically. Useful for populating the edition filter dropdown.
      responses:
        "200":
          description: List of edition strings.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["Charts", "Party", "SingStar"]

  /api/filters/tags:
    get:
      operationId: getTags
      tags: [Filters]
      summary: List all tags used in the library
      description: |
        Returns the distinct tag values across all songs, sorted
        alphabetically. Useful for populating tag suggestions.
      responses:
        "200":
          description: List of tag strings.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["classic", "favorite", "party"]

  /api/filters/languages:
    get:
      operationId: getLanguages
      tags: [Filters]
      summary: List all languages present in the library
      description: |
        Returns the distinct language values across all songs, sorted
        alphabetically. Useful for populating the language filter dropdown.
      responses:
        "200":
          description: List of language strings.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["English", "German", "Spanish", "Japanese"]

  /api/settings:
    get:
      operationId: getSettings
      tags: [Settings]
      summary: Get current application settings
      description: |
        Returns the current application settings. If no settings have been
        saved yet, returns the default values.
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [Settings]
      summary: Update application settings
      description: |
        Accepts a partial or full settings object. Provided fields are merged
        with existing settings; omitted fields retain their current values.
        Returns the complete merged settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Updated settings (merged result).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Invalid settings values (out of range).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    songId:
      name: songId
      in: path
      required: true
      description: Unique identifier of the song.
      schema:
        type: string

  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Song:
      type: object
      required: [id, title, artist, bpm, gap]
      properties:
        id:
          type: string
          description: Unique identifier for the song.
          example: "queen-bohemian-rhapsody"
        title:
          type: string
          description: Song title (from `#TITLE` header).
          example: "Bohemian Rhapsody"
        artist:
          type: string
          description: Artist name (from `#ARTIST` header).
          example: "Queen"
        genre:
          type: string
          nullable: true
          description: Genre (from `#GENRE` header), null if not specified.
          example: "Rock"
        year:
          type: integer
          nullable: true
          description: Release year (from `#YEAR` header), null if not specified.
          example: 1975
        language:
          type: string
          nullable: true
          description: Language (from `#LANGUAGE` header), null if not specified.
          example: "English"
        edition:
          type: string
          nullable: true
          description: Edition tag (from `#EDITION` header), null if not specified.
          example: "Charts"
        creator:
          type: string
          nullable: true
          description: Who created the UltraStar file (from `#CREATOR` header).
        bpm:
          type: number
          format: double
          description: |
            Beats per minute as stored in the file (before the implicit 4x
            multiplication). Used for beat-to-millisecond conversion.
          example: 71.5
        gap:
          type: number
          format: double
          description: |
            Offset in milliseconds from audio start to beat 0
            (from `#GAP` header). Defaults to 0 if absent.
          example: 5320.0
        duet:
          type: boolean
          description: Whether this is a multi-voice (duet) song.
          default: false
        voiceNames:
          type: array
          nullable: true
          description: |
            Names of the voices for duet songs (from `#P1`–`#P9` headers).
            Null for single-voice songs.
          items:
            type: string
          example: ["Freddie", "Roger"]
        previewStart:
          type: number
          format: double
          nullable: true
          description: |
            Offset in seconds where the song preview should start
            (from `#PREVIEWSTART` header).
        coverUrl:
          type: string
          format: uri
          nullable: true
          description: |
            URL to retrieve the full-size cover image. Null if no cover exists
            or if the song is still processing (assets not yet uploaded).
          example: "/api/songs/queen-bohemian-rhapsody/cover"
        thumbnailUrl:
          type: string
          format: uri
          nullable: true
          description: |
            URL to retrieve a small (~200px) JPEG thumbnail of the cover.
            Available immediately after import (stored in DB). Preferred for
            library grid views to save bandwidth.
          example: "/api/songs/queen-bohemian-rhapsody/thumbnail"
        backgroundUrl:
          type: string
          format: uri
          nullable: true
          description: URL to retrieve the background image, or null if none exists.
          example: "/api/songs/queen-bohemian-rhapsody/background"
        audioUrl:
          type: string
          format: uri
          nullable: true
          description: URL to stream the audio file, or null if no audio exists.
          example: "/api/songs/queen-bohemian-rhapsody/audio"
        tags:
          type: array
          nullable: true
          description: User-defined tags for categorization.
          items:
            type: string
          example: ["classic", "favorite", "party"]
        status:
          type: string
          enum: [ready, processing, broken]
          description: |
            Current state of the song:
            - `ready`: All files uploaded and available for playback.
            - `processing`: Song was just imported and large files (audio, cover,
              background) are still uploading to storage in the background.
              Metadata and thumbnail are available; asset URLs are null.
            - `broken`: Essential files are missing (e.g., .txt file lost).
          default: ready
          example: "ready"
        played:
          type: boolean
          description: |
            Whether this song has been played at least once. Songs that have
            never been played show a "New" badge in the library grid.
          default: false

    SongUpdate:
      type: object
      description: |
        Partial song metadata update. Only provided fields are updated.
        Send an empty string to clear a text field, or an empty array to
        clear tags.
      properties:
        title:
          type: string
          description: Updated song title.
        artist:
          type: string
          description: Updated artist name.
        genre:
          type: string
          description: Updated genre. Empty string clears it.
        edition:
          type: string
          description: Updated edition. Empty string clears it.
        creator:
          type: string
          description: Updated creator name. Empty string clears it.
        year:
          type: integer
          nullable: true
          description: Updated release year. Null clears it.
        language:
          type: string
          description: Updated language. Empty string clears it.
        tags:
          type: array
          description: Updated tags. Empty array clears them.
          items:
            type: string

    SongPage:
      type: object
      required: [content, totalElements, totalPages, page, size]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Song"
          description: Songs on the current page.
        totalElements:
          type: integer
          description: Total number of songs matching the query.
          example: 142
        totalPages:
          type: integer
          description: Total number of pages.
          example: 3
        page:
          type: integer
          description: Current zero-based page index.
          example: 0
        size:
          type: integer
          description: Page size.
          example: 50

    LyricTimeline:
      type: object
      required: [songId, lines]
      properties:
        songId:
          type: string
          description: ID of the song this timeline belongs to.
          example: "queen-bohemian-rhapsody"
        lines:
          type: array
          description: Ordered list of lyric lines (phrases).
          items:
            $ref: "#/components/schemas/LyricLine"

    LyricLine:
      type: object
      required: [tokens, startMs]
      properties:
        startMs:
          type: number
          format: double
          description: Start time of this line in milliseconds from audio start.
          example: 5320.0
        tokens:
          type: array
          description: |
            Ordered syllable tokens within this line. Concatenating all
            token texts reproduces the full lyric text for the line.
          items:
            $ref: "#/components/schemas/LyricToken"

    LyricToken:
      type: object
      required: [text, startMs, durationMs, pitch, noteType]
      properties:
        text:
          type: string
          description: |
            Syllable text, including any leading/trailing spaces that separate
            it from adjacent syllables.
          example: "Is "
        startMs:
          type: number
          format: double
          description: Start time of this token in milliseconds from audio start.
          example: 5320.0
        durationMs:
          type: number
          format: double
          description: Duration of this token in milliseconds.
          example: 420.0
        pitch:
          type: integer
          description: |
            MIDI-relative pitch as half-steps from C4 (middle C).
            Ignored for freestyle and rap notes.
          example: 5
        noteType:
          $ref: "#/components/schemas/NoteType"

    NoteType:
      type: string
      description: |
        UltraStar note type indicating scoring behavior:
        - `:` Normal note — standard pitch scoring
        - `*` Golden note — awards bonus points
        - `F` Freestyle — not scored
        - `R` Rap — scored on timing only, pitch ignored
        - `G` Golden rap — rap with bonus points
      enum: [":", "*", "F", "R", "G"]

    Settings:
      type: object
      description: |
        User-configurable application settings. All fields are optional on
        update — omitted fields retain their current values.
      properties:
        pitchTolerance:
          type: number
          format: double
          description: |
            How many semitones the singer's pitch can deviate from the
            expected note and still count as a hit. Lower values make
            scoring harder.
          minimum: 0.5
          maximum: 4.0
          default: 2.0
          example: 2.0
        micSensitivity:
          type: number
          format: double
          description: |
            RMS energy threshold for silence detection. Lower values make
            the microphone more sensitive (picks up quieter singing),
            higher values ignore more background noise.
          minimum: 0.005
          maximum: 0.05
          default: 0.01
          example: 0.01
        showPitchIndicator:
          type: boolean
          description: |
            Whether to display the vertical pitch gauge during singing.
            The gauge shows the singer's detected pitch relative to the
            expected note in real time.
          default: true
          example: true

    Error:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
          description: HTTP status code.
          example: 404
        message:
          type: string
          description: Human-readable error description.
          example: "Song not found"
        detail:
          type: string
          nullable: true
          description: Additional detail about the error, if available.
